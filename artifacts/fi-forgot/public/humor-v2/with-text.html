<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; padding: 32px 24px; font-family: Georgia, serif; }
  h2 { color: #ccc; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 340px); gap: 32px; justify-content: center; }
  .card {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    aspect-ratio: 5/7;
    background: #222;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Dark gradient overlay at the bottom */
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.82) 100%);
    pointer-events: none;
  }
  .caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 22px 26px;
    z-index: 2;
    text-align: center;
    color: #fff;
    font-family: 'Georgia', serif;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 0.05em;
    line-height: 1.35;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<h2>With Front Cover Captions</h2>
<div class="grid">

  <div class="card">
    <img src="lord_fluffington_v2.png" alt="Lord Fluffington">
    <div class="caption">I REGRET NOTHING.</div>
  </div>

  <div class="card">
    <img src="coffee_before_humanity_v2.png" alt="Coffee Before Humanity">
    <div class="caption">COFFEE.<br>THEN WE CAN DISCUSS<br>YOUR PROBLEMS.</div>
  </div>

  <div class="card">
    <img src="golf_goose_v2.png" alt="Golf Goose">
    <div class="caption">I'VE INVESTED TOO MUCH<br>TO WALK AWAY NOW.</div>
  </div>

</div>
</body>
</html>
