<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Funny Batch 1</title>
<style>
  body { background: #FAF7F2; margin: 0; padding: 28px 24px; font-family: sans-serif; }
  h2 { font-size: 22px; margin: 0 0 20px; color: #1F1F1F; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .card { border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.12); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card p { margin: 0; padding: 7px 8px; font-size: 11px; font-weight: 600; color: #444; text-align: center; }
</style>
</head>
<body>
<h2>Funny Batch 1 — 15 Cards</h2>
<div class="grid">
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/95a18f181c_cover_34d4efb3c8.png"><p>Lord Fluffington</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/664789cfa0_cover_d8cfb9a2d3.png"><p>Holy Coffee</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/0b9484ae30_cover_0263efb571.png"><p>Too Many Candles</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/8286ecdeef_cover_252bda3bc3.png"><p>Champion of Later</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/d483201895_cover_3b530ea56b.png"><p>I Did Nothing</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/855672dffd_cover_240b96a51b.png"><p>Wine O'Clock</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/7afc669b05_cover_769a6b54dd.png"><p>Aged to Perfection</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/564cce80b4_cover_1dbf32131f.png"><p>Inbox Zero (Never)</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/423d5bd635_cover_54fa2afe08.png"><p>I Tried</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/e29914b452_cover_90151b5937.png"><p>Both Valid Points</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/0b772905e1_cover_923d6e9c76.png"><p>Ambitious Reading List</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/260c8ff0a0_cover_72977632f9.png"><p>Peak Productivity</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/1f363684bc_cover_02999c6865.png"><p>Getting Warmer</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/e76fb9574a_cover_2c356e75ea.png"><p>A Portrait of Monday</p></div>
  <div class="card"><img src="https://d3e924qpzqov0g.cloudfront.net/cardimages/customCards/84163a16ff_cover_50949d6d9f.png"><p>Nailed It</p></div>
</div>
</body>
</html>
