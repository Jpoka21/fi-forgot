kind = "web"
previewPath = "/"
title = "F.I. Forgot"
version = "1.0.0"
id = "artifacts/fi-forgot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25460

[services.development]
run = "pnpm --filter @workspace/fi-forgot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fi-forgot", "run", "build" ]
publicDir = "artifacts/fi-forgot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25460"
BASE_PATH = "/"
